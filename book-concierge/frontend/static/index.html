<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PageTurner - Book Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --accent-light: #ede9fe;
    --accent-subtle: #f5f3ff;
    --bg: #f8fafc;
    --chat-bg: #fdfbf7;
    --border: #e2e8f0;
    --border-warm: #ebd5b3;
    --text-primary: #1e293b;
    --text-muted: #64748b;
    --user-bubble: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    --agent-bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text-primary);
  }
  header {
    background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 60%, #7c3aed 100%);
    color: #fff;
    padding: 0.9rem 1.6rem;
    font-weight: 700;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(91, 33, 182, 0.15);
    z-index: 10;
  }
  .header-brand { display: flex; align-items: center; gap: 0.6rem; }
  .header-tagline { font-size: 0.8rem; font-weight: 400; opacity: 0.85; background: rgba(255,255,255,0.15); padding: 0.2rem 0.6rem; border-radius: 12px; }
  
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  /* Dialogue / Message Entry Layout */
  .msg-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user {
    flex-direction: row-reverse;
  }

  /* Avatars */
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
  }
  .msg-row.agent .avatar {
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    border: 1.5px solid #c4b5fd;
    color: #6d28d9;
  }
  .msg-row.user .avatar {
    background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
    border: 1.5px solid #6d28d9;
    color: #fff;
    font-size: 0.95rem;
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .msg-row.user .msg-content {
    align-items: flex-end;
  }
  .msg-row.agent .msg-content {
    align-items: flex-start;
  }

  .msg-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
    padding: 0 0.2rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  /* Chat Bubbles */
  .bubble {
    display: inline-block;
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 0.95rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  .msg-row.agent .bubble {
    border-top-left-radius: 4px;
    border-left: 3px solid var(--accent);
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
  }
  /* When the reply is an A2UI card */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Suggestions Bar */
  .suggestions-wrapper {
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 0.6rem 1rem 0.2rem;
  }
  .suggestions {
    display: flex;
    gap: 0.5rem;
    max-width: 820px;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
    align-items: center;
  }
  .suggestions::-webkit-scrollbar { display: none; }
  .chip {
    background: #f8fafc;
    color: #475569;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .chip:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: #c4b5fd;
    transform: translateY(-2px);
    box-shadow: 0 3px 8px rgba(124, 58, 237, 0.12);
  }

  /* Input Form */
  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1rem 1rem;
    background: #fff;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .input-container {
    display: flex;
    width: 100%;
    max-width: 820px;
    background: #fff;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.03);
    flex-direction: column;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    background: #fbfcfe;
    transition: all 0.2s;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
  }
  button[type="submit"] {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button[type="submit"]:hover {
    background: var(--accent-hover);
    box-shadow: 0 4px 10px rgba(109, 40, 217, 0.25);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    max-width: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .a2card:hover {
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #3b0764; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #4c1d95; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #5b21b6; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: #6d28d9; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span>📚</span>
    <span>PageTurner</span>
  </div>
  <div class="header-tagline">AI Book Concierge</div>
</header>
<div id="log"></div>
<div class="input-container">
  <div class="suggestions-wrapper">
    <div class="suggestions">
      <button type="button" class="chip" onclick="submitPrompt('Recommend a fast-paced sci-fi thriller like Project Hail Mary')">🚀 Sci-fi thriller</button>
      <button type="button" class="chip" onclick="submitPrompt('Show my current reading progress and library status')">📖 Reading progress</button>
      <button type="button" class="chip" onclick="submitPrompt('Generate a custom cover art illustration for Dune')">🎨 Custom cover art</button>
    </div>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask PageTurner for book recommendations, tracking, or classics…" autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function submitPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function getTimeString() {
  const now = new Date();
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "📖");
  const content = el("div", "msg-content");
  
  const meta = el("div", "msg-meta");
  meta.appendChild(el("span", "sender-name", who === "user" ? "You" : "PageTurner"));
  meta.appendChild(el("span", "time", "• " + getTimeString()));
  content.appendChild(meta);

  const b = el("div", "bubble");
  content.appendChild(b);

  row.appendChild(avatar);
  row.appendChild(content);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
